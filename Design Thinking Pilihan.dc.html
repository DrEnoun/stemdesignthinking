<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    @keyframes dtCard { 0% { opacity:0; transform:translateY(40px) scale(.94) } 100% { opacity:1; transform:translateY(0) scale(1) } }
    @keyframes dtFade { 0% { opacity:0 } 100% { opacity:1 } }
    @keyframes dtNudge { 0%,100% { transform:translateX(0) } 50% { transform:translateX(-14px) } }
    @keyframes dtHover { 0%,100% { transform:translateY(0) rotate(-3deg) } 50% { transform:translateY(-18px) rotate(3deg) } }
    @keyframes dtGlow { 0%,100% { box-shadow:0 0 0 0 rgba(255,217,61,.55), 0 10px 30px rgba(0,0,0,.4) } 50% { box-shadow:0 0 42px 14px rgba(255,217,61,.32), 0 10px 30px rgba(0,0,0,.4) } }
  </style>
  <script src="./sfx.js"></script>
</helmet>

<div style="position:relative;width:100%;height:100%;font-family:'Nunito',sans-serif">

  <div style="position:absolute;left:6%;top:15%;width:44%;height:82%;background:#0A1A4D;border-radius:28px;padding:34px 28px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:26px">
    <div style="font-size:28px;font-weight:800;color:#7DD3FC;letter-spacing:3px">APA YANG ANDA LIHAT?</div>
    <div onClick="{{ pickMasalah }}" role="button" tabindex="0" style="cursor:pointer;background:#2A1055;border:5px solid #22D3EE;box-shadow:12px 12px 0 #EC4899;padding:30px 44px;font-family:'Baloo 2',cursive;font-size:96px;font-weight:800;color:#FFD93D;line-height:1" style-hover="transform:translate(-4px,-4px);box-shadow:16px 16px 0 #EC4899" style-active="transform:translate(4px,4px);box-shadow:6px 6px 0 #EC4899">MASALAH</div>
    <div style="padding-left:44px;font-family:'Baloo 2',cursive;font-size:56px;font-weight:700;color:#ffffff;letter-spacing:2px">ATAU</div>
    <div onClick="{{ pickPeluang }}" role="button" tabindex="0" style="cursor:pointer;background:#2A1055;border:5px solid #22D3EE;box-shadow:12px 12px 0 #EC4899;padding:30px 44px;font-family:'Baloo 2',cursive;font-size:96px;font-weight:800;color:#A3E635;line-height:1" style-hover="transform:translate(-4px,-4px);box-shadow:16px 16px 0 #EC4899" style-active="transform:translate(4px,4px);box-shadow:6px 6px 0 #EC4899">PELUANG?</div>
  </div>

  <div style="position:absolute;left:53.5%;top:56%;margin-top:-64px;z-index:6;display:flex;align-items:center;gap:18px;animation:dtHover 3.2s ease-in-out infinite">
    <div style="color:#FFD93D;animation:dtNudge 1.4s ease-in-out infinite">
      <svg viewBox="0 0 24 24" width="88" height="88" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 12H5" /><path d="M11 6l-6 6 6 6" /></svg>
    </div>
    <div style="background:#2A1055;border:5px solid #FFD93D;border-radius:999px;padding:18px 50px;font-family:'Baloo 2',cursive;font-size:78px;font-weight:800;color:#FFD93D;letter-spacing:3px;line-height:1;animation:dtGlow 2.2s ease-in-out infinite">PILIH</div>
  </div>

  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:0;top:0;width:100%;height:100%;z-index:20;background:rgba(6,18,47,.9);display:flex;align-items:center;justify-content:center;padding:80px;box-sizing:border-box;animation:dtFade .22s ease-out both">
      <div style="width:1180px;max-width:100%;background:#0A1A4D;border:6px solid {{ accent }};border-radius:40px;padding:52px 60px;box-sizing:border-box;display:flex;flex-direction:column;gap:28px;box-shadow:0 30px 80px rgba(0,0,0,.55);animation:dtCard .3s cubic-bezier(.2,.9,.3,1.2) both">
        <div style="display:flex;align-items:center;gap:20px">
          <div style="background:#2A1055;border:4px solid {{ accent }};border-radius:999px;padding:10px 30px;font-size:30px;font-weight:800;color:{{ accent }};letter-spacing:3px">{{ tag }}</div>
          <div onClick="{{ onClose }}" role="button" tabindex="0" style="margin-left:auto;cursor:pointer;background:#0F2A6B;border:4px solid #7DD3FC;border-radius:999px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;color:#7DD3FC;font-size:36px;font-weight:800">×</div>
        </div>
        <h2 style="margin:0;font-family:'Baloo 2',cursive;font-size:82px;font-weight:800;color:{{ accent }};line-height:1;text-wrap:balance">{{ title }}</h2>
        <p style="margin:0;font-size:42px;font-weight:700;color:#ffffff;line-height:1.3;text-wrap:pretty">{{ body }}</p>
        <div style="background:#0F2A6B;border-left:10px solid {{ accent }};border-radius:16px;padding:24px 30px;font-size:40px;font-weight:800;color:#FFD93D;line-height:1.25;text-wrap:pretty">{{ cta }}</div>
        <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
          <div onClick="{{ onOther }}" role="button" tabindex="0" style="cursor:pointer;display:inline-flex;align-items:center;gap:14px;background:#FFD93D;border-radius:999px;padding:16px 40px;font-size:34px;font-weight:800;color:#0A1A4D">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round" style="flex:none"><path d="M4 12h15" /><path d="M13 6l6 6-6 6" /></svg>
            {{ otherLabel }}
          </div>
          <div onClick="{{ onClose }}" role="button" tabindex="0" style="cursor:pointer;background:#0A1A4D;border:4px solid #7DD3FC;border-radius:999px;padding:14px 36px;font-size:34px;font-weight:800;color:#7DD3FC">TUTUP</div>
        </div>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080}}">
class Component extends DCLogic {
  state = { pick: null };
  copy = {
    masalah: {
      tag: 'ANDA PILIH: MASALAH',
      accent: '#FFD93D',
      title: 'Betul — dan itu titik mula yang baik.',
      body: 'Setiap inovasi besar bermula daripada seseorang yang perasan satu masalah dan tidak berpaling. Anda sudah buat langkah pertama: melihat.',
      cta: 'Jangan berhenti di situ. Tukar masalah itu kepada soalan: “Bagaimana jika…?”',
      other: 'CUBA LIHAT SEBAGAI PELUANG'
    },
    peluang: {
      tag: 'ANDA PILIH: PELUANG',
      accent: '#A3E635',
      title: 'Anda sudah berfikir seperti pereka!',
      body: 'Pemerhatian yang sama boleh jadi peluang. Sisa kantin hari ini boleh jadi baja esok — yang berubah hanyalah cara kita melihat.',
      cta: 'Teruskan: jana idea, bina prototaip kecil, dan uji. Mula dengan satu masalah kecil di sekolah anda.',
      other: 'LIHAT JAWAPAN “MASALAH”'
    }
  };
  componentDidMount() {
    const stage = document.querySelector('deck-stage');
    if (stage && !stage.hasAttribute('no-rail')) {
      stage.setAttribute('no-rail', 'true');
      window.dispatchEvent(new Event('resize'));
    }
  }
  sfx(name) {
    const s = window.DTSFX;
    if (s && s[name]) { try { s[name](); } catch (e) {} }
  }
  renderVals() {
    const pick = this.state.pick;
    const c = pick ? this.copy[pick] : null;
    return {
      open: !!pick,
      tag: c ? c.tag : '',
      accent: c ? c.accent : '#FFD93D',
      title: c ? c.title : '',
      body: c ? c.body : '',
      cta: c ? c.cta : '',
      otherLabel: c ? c.other : '',
      pickMasalah: () => { this.sfx('correct'); this.setState({ pick: 'masalah' }); },
      pickPeluang: () => { this.sfx('win'); this.setState({ pick: 'peluang' }); },
      onClose: () => { this.sfx('click'); this.setState({ pick: null }); },
      onOther: () => { this.sfx('flip'); this.setState({ pick: pick === 'masalah' ? 'peluang' : 'masalah' }); }
    };
  }
}
</script>
</body>
</html>
